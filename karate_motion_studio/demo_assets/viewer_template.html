<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karate Motion Studio 3D Viewport</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #16171a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    


    .telemetry {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(20, 21, 24, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #8c939e;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      pointer-events: none;
      z-index: 100;
    }
    .telemetry span { color: #38ef7d; }
  </style>
  <script src="/js/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>
  <script src="/js/OrbitControls.js"></script>
  <script>
    if (typeof THREE !== 'undefined' && !THREE.OrbitControls) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>');
    }
  </script>
  <script src="/js/GLTFLoader.js"></script>
  <script>
    if (typeof THREE !== 'undefined' && !THREE.GLTFLoader) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>



  <div class="telemetry">
    Режим: <span id="telem-mode">Аватар + Скелет</span> | FPS: <span id="telem-fps">60</span> | Пальцы: <span id="telem-fingers" style="color:#10b981;font-weight:bold;">● AI готов</span>
  </div>

  <script>
    // --- THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x16171a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2.0, 1.4, 2.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.95, 0);

    // Dojo Tatami Floor & Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x2b2f3a, 0.9);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
    dirLight.position.set(3, 7, 4);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x70a1ff, 0.45);
    rimLight.position.set(-3, 4, -2.5);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(6, 24, 0xe05260, 0x282b33);
    grid.position.y = 0;
    scene.add(grid);

    // --- SKELETON 3D LAYER (NEUTRAL TEST AVATAR) ---
    const skeletonGroup = new THREE.Group();
    skeletonGroup.position.set(0, 0.9, 0); // Position at avatar hip height
    scene.add(skeletonGroup);

    const jointSpheres = {};
    const boneCylinders = [];

    const sphereGeom = new THREE.SphereGeometry(0.024, 12, 12);
    const jointMatTorso = new THREE.MeshStandardMaterial({ color: 0xff3b57, roughness: 0.3 });
    const jointMatLeft  = new THREE.MeshStandardMaterial({ color: 0x00d2d3, roughness: 0.3 });
    const jointMatRight = new THREE.MeshStandardMaterial({ color: 0xff9f43, roughness: 0.3 });
    const jointMatHead  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
    const boneMat       = new THREE.MeshStandardMaterial({ color: 0x57606f, roughness: 0.5 });

    const SKELETON_BONES = [
      ["left_shoulder", "right_shoulder"],
      ["left_shoulder", "left_hip"],
      ["right_shoulder", "right_hip"],
      ["left_hip", "right_hip"],
      ["left_shoulder", "left_elbow"],
      ["left_elbow", "left_wrist"],
      ["right_shoulder", "right_elbow"],
      ["right_elbow", "right_wrist"],
      ["left_hip", "left_knee"],
      ["left_knee", "left_ankle"],
      ["left_ankle", "left_heel"],
      ["left_heel", "left_foot_index"],
      ["left_ankle", "left_foot_index"],
      ["right_hip", "right_knee"],
      ["right_knee", "right_ankle"],
      ["right_ankle", "right_heel"],
      ["right_heel", "right_foot_index"],
      ["right_ankle", "right_foot_index"],
      ["nose", "left_ear"],
      ["nose", "right_ear"]
    ];

    function createNeutralSkeleton() {
      const allJoints = [
        "nose", "left_ear", "right_ear", "left_shoulder", "right_shoulder",
        "left_elbow", "right_elbow", "left_wrist", "right_wrist",
        "left_hip", "right_hip", "left_knee", "right_knee",
        "left_ankle", "right_ankle", "left_heel", "right_heel",
        "left_foot_index", "right_foot_index"
      ];

      for (const j of allJoints) {
        let mat = jointMatTorso;
        if (j.startsWith("left")) mat = jointMatLeft;
        else if (j.startsWith("right")) mat = jointMatRight;
        else if (j === "nose") mat = jointMatHead;

        const sphere = new THREE.Mesh(sphereGeom, mat);
        sphere.castShadow = true;
        skeletonGroup.add(sphere);
        jointSpheres[j] = sphere;
      }

      const cylGeom = new THREE.CylinderGeometry(0.012, 0.012, 1, 8);
      for (const [a, b] of SKELETON_BONES) {
        const mesh = new THREE.Mesh(cylGeom, boneMat);
        mesh.castShadow = true;
        skeletonGroup.add(mesh);
        boneCylinders.push({ mesh, a, b });
      }
    }
    createNeutralSkeleton();

    // --- GLB AVATAR (CUSTOM RIGGED MODEL) ---
    let avatarModel = null;
    let skeletonHelper = null;
    const boneMap = {};
    let isModelReady = false;

    function getBone(name) {
      if (!name) return null;
      if (boneMap[name]) return boneMap[name];
      const dotless = name.replace(/\./g, '');
      if (boneMap[dotless]) return boneMap[dotless];
      if (name.endsWith('L') && !name.includes('.')) {
        const dotted = name.slice(0, -1) + '.L';
        if (boneMap[dotted]) return boneMap[dotted];
      } else if (name.endsWith('R') && !name.includes('.')) {
        const dotted = name.slice(0, -1) + '.R';
        if (boneMap[dotted]) return boneMap[dotted];
      }
      return null;
    }

    const gltfLoader = new THREE.GLTFLoader();

    function loadModel(url) {
      gltfLoader.load(url, (gltf) => {
        if (avatarModel) scene.remove(avatarModel);
        if (skeletonHelper) scene.remove(skeletonHelper);

        avatarModel = gltf.scene;
        scene.add(avatarModel);
        avatarModel.updateMatrixWorld(true);

        avatarModel.traverse((node) => {
          if (node.isBone) {
            const raw = node.name;
            boneMap[raw] = node;
            boneMap[raw.replace(/\./g, '')] = node;
            if (raw.endsWith('L') && !raw.includes('.')) {
              boneMap[raw.slice(0, -1) + '.L'] = node;
            } else if (raw.endsWith('R') && !raw.includes('.')) {
              boneMap[raw.slice(0, -1) + '.R'] = node;
            } else if (raw.includes('.')) {
              boneMap[raw.replace('.', '')] = node;
            }

            node.restLocalQ = node.quaternion.clone();
            node.restWorldQ = new THREE.Quaternion();
            node.getWorldQuaternion(node.restWorldQ);
            node.restWorldDir = new THREE.Vector3(0, 1, 0).applyQuaternion(node.restWorldQ).normalize();
          }
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;

            // ANATOMICAL KIMONO LAYER PRIORITY & CLOTH PENETRATION PREVENTION:
            // Kimono (jacket, pants, obi belt) is physical cloth worn OVER the body skin.
            if (node.name.includes("Gi") || node.name.includes("Belt") || node.name.includes("Obi")) {
              node.renderOrder = 2;
              if (node.material) {
                node.material.polygonOffset = true;
                node.material.polygonOffsetFactor = -2.5; // pull kimono forward towards camera in depth buffer
                node.material.polygonOffsetUnits = -5.0;
                node.material.depthTest = true;
                node.material.depthWrite = true;
              }
            } else if (node.name.includes("Mesh") || node.name.includes("Skin") || node.name === "Karateka_Mesh") {
              node.renderOrder = 1;
              if (node.material) {
                node.material.polygonOffset = true;
                node.material.polygonOffsetFactor = 3.0; // push body skin inward in depth buffer
                node.material.polygonOffsetUnits = 6.0;
              }
              // Deflate covered skin vertices in torso and upper thighs (y in [0.15, 1.45], |x| < 0.38)
              // so skin sits safely inside the loose kimono and never pokes out through cloth folds!
              if (node.geometry && node.geometry.attributes.position && node.geometry.attributes.normal) {
                const pos = node.geometry.attributes.position;
                const norm = node.geometry.attributes.normal;
                for (let i = 0; i < pos.count; i++) {
                  const y = pos.getY(i);
                  const x = pos.getX(i);
                  if (y > 0.15 && y < 1.45 && Math.abs(x) < 0.38) {
                    const nx = norm.getX(i);
                    const ny = norm.getY(i);
                    const nz = norm.getZ(i);
                    pos.setXYZ(i, pos.getX(i) - nx * 0.016, pos.getY(i) - ny * 0.016, pos.getZ(i) - nz * 0.016);
                  }
                }
                pos.needsUpdate = true;
                node.geometry.computeVertexNormals();
              }
            }
          }
        });

        skeletonHelper = new THREE.SkeletonHelper(avatarModel);
        skeletonHelper.visible = (currentViewMode === "both" || currentViewMode === "skeleton");
        scene.add(skeletonHelper);

        skeletonGroup.visible = (currentViewMode === "both" || currentViewMode === "skeleton");
        isModelReady = true;
        console.log("Avatar model loaded successfully:", url);
      }, undefined, (err) => {
        console.warn("Custom GLB not loaded, using neutral test skeleton:", err);
      });
    }

    // Attempt default model load
    loadModel("/karateka_lowpoly.glb");

    
        // --- HIGH-PRECISION KINEMATICS & CONTINUOUS AZIMUTH TRACKER ---
    let lastPelvisRawYaw = null;
    let continuousPelvisYaw = 0.0;

    function makeBasisQ(x, y, z) {
      const m = new THREE.Matrix4().makeBasis(x, y, z);
      return new THREE.Quaternion().setFromRotationMatrix(m);
    }

    // --- REVOLUTIONARY ANATOMICAL ARM & ELBOW HINGE SOLVER (ZERO DISLOCATION / ZERO FLIP) ---
    // 1. UpperArm: Orthonormal basis matching GLB rest pose (Col 1 = Y along bone, Col 2 = Z hinge axis)
    // 2. LowerArm: PURE 1-DOF Revolute Hinge (Right flexes around +Z, Left flexes around -Z)
    // Eliminates all hemisphere flips, sideways twists, and mesh breakage!
    function alignArm(bUpper, bLower, vArm, vForearm, torsoFwd, shoulderLateral, sideKey = 'R', alpha = 0.85) {
      if (!bUpper || !vArm || vArm.lengthSq() < 1e-4) return;
      const isLeft = (sideKey === 'L');
      const uArm = vArm.clone().normalize();

      // Natural anatomical hinge vector:
      // In T-pose, elbow hinge points UP (+Y).
      let hNat = isLeft
        ? new THREE.Vector3().crossVectors(torsoFwd, uArm)
        : new THREE.Vector3().crossVectors(torsoFwd, uArm).negate();
      if (hNat.lengthSq() < 1e-4) {
        hNat.set(0, 1, 0);
      } else {
        hNat.normalize();
      }

      const hasForearm = (bLower && vForearm && vForearm.lengthSq() > 1e-4);
      let zHinge = hNat.clone();
      let flexAngle = 0.0;

      if (hasForearm) {
        const uForearm = vForearm.clone().normalize();
        const dotCollinear = Math.max(-1.0, Math.min(1.0, uArm.dot(uForearm)));
        flexAngle = Math.acos(dotCollinear); // [0, PI]
        flexAngle = Math.max(0.0, Math.min(Math.PI * 0.86, flexAngle)); // clamp to 155 deg

        if (flexAngle > 0.08) {
          // Measured bend plane normal
          // For Right: cross(vArm, vForearm) points UP (+Y)
          // For Left: cross(vForearm, vArm) points UP (+Y)
          const nBend = isLeft
            ? new THREE.Vector3().crossVectors(vForearm, vArm)
            : new THREE.Vector3().crossVectors(vArm, vForearm);
          if (nBend.lengthSq() > 1e-4) {
            nBend.normalize();
            if (nBend.dot(hNat) < 0) nBend.negate();
            const blendW = Math.min(1.0, (flexAngle - 0.08) / 0.25);
            zHinge.lerp(nBend, blendW).normalize();
          }
        }
      }

      // Gram-Schmidt orthogonalization: ensure zUpper is strictly perpendicular to uArm
      let zUpper = zHinge.clone().sub(uArm.clone().multiplyScalar(zHinge.dot(uArm)));
      if (zUpper.lengthSq() < 1e-4) {
        zUpper.copy(hNat);
      } else {
        zUpper.normalize();
      }

      const xUpper = new THREE.Vector3().crossVectors(uArm, zUpper).normalize();
      zUpper.crossVectors(xUpper, uArm).normalize();

      const qUpperWorld = makeBasisQ(xUpper, uArm, zUpper);
      const pQUpper = new THREE.Quaternion();
      if (bUpper.parent) bUpper.parent.getWorldQuaternion(pQUpper);
      const targetLocalUpper = pQUpper.clone().invert().multiply(qUpperWorld);
      bUpper.quaternion.slerp(targetLocalUpper, alpha);
      bUpper.updateMatrixWorld(true);

      // Anatomical 1-DOF Elbow Flexion:
      // For Right Arm: flexes forward around Local +Z
      // For Left Arm: flexes forward around Local -Z
      if (hasForearm && bLower) {
        const bendAxis = isLeft ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 0, 1);
        const qLowerLocal = new THREE.Quaternion().setFromAxisAngle(bendAxis, flexAngle);
        bLower.quaternion.slerp(qLowerLocal, alpha);
        bLower.updateMatrixWorld(true);
      }
    }

    // --- REVOLUTIONARY ANATOMICAL LEG & KNEE HINGE SOLVER (ZERO FLAMINGO / ZERO BREAKAGE) ---
    // 1. UpperLeg: Thigh vector with lateral pelvis hinge orientation
    // 2. LowerLeg: PURE 1-DOF Revolute Hinge (strictly backward flexion around Local +X for BOTH legs)
    function alignLeg(bUpper, bLower, vThigh, vShin, torsoFwd, pelvisLateral, sideKey = 'R', alpha = 0.85) {
      if (!bUpper || !vThigh || vThigh.lengthSq() < 1e-4) return;
      const isLeft = (sideKey === 'L');
      const uThigh = vThigh.clone().normalize();

      // Lateral axis of pelvis (pointing right to left in world space)
      let xLat = pelvisLateral ? pelvisLateral.clone() : new THREE.Vector3(1, 0, 0);
      if (xLat.lengthSq() < 1e-4) xLat.set(1, 0, 0);
      else xLat.normalize();

      // Gram-Schmidt orthogonalization: ensure knee hinge axis xUpper is perpendicular to thigh
      let xUpper = xLat.clone().sub(uThigh.clone().multiplyScalar(xLat.dot(uThigh)));
      if (xUpper.lengthSq() < 1e-4) {
        xUpper.copy(xLat);
      } else {
        xUpper.normalize();
      }

      // Dorsal axis zUpper: cross(xUpper, uThigh) points BACKWARD [0, 0, -1] in rest pose
      const zUpper = new THREE.Vector3().crossVectors(xUpper, uThigh).normalize();
      xUpper.crossVectors(uThigh, zUpper).normalize();

      const qUpperWorld = makeBasisQ(xUpper, uThigh, zUpper);
      const pQUpper = new THREE.Quaternion();
      if (bUpper.parent) bUpper.parent.getWorldQuaternion(pQUpper);
      const targetLocalUpper = pQUpper.clone().invert().multiply(qUpperWorld);
      bUpper.quaternion.slerp(targetLocalUpper, alpha);

      // Anatomical 1-DOF Knee Flexion:
      // In karateka_lowpoly.glb, both Left and Right legs flex strictly BACKWARD around Local +X
      const hasShin = (bLower && vShin && vShin.lengthSq() > 1e-4);
      if (hasShin && bLower) {
        let uShin = vShin.clone().normalize();
        let dotCollinear = Math.max(-1.0, Math.min(1.0, uThigh.dot(uShin)));

        // 2D Projection Collinearity on the Camera Plane:
        // MediaPipe 2D detection on camera clearly sees whether knee and ankle form a straight line
        const lenThighXY = Math.hypot(vThigh.x, vThigh.y);
        const lenShinXY = Math.hypot(vShin.x, vShin.y);
        const dot2D = (lenThighXY > 1e-4 && lenShinXY > 1e-4)
          ? (vThigh.x * vShin.x + vThigh.y * vShin.y) / (lenThighXY * lenShinXY)
          : dotCollinear;

        // KNEE EXTENSION & KICK LOCKOUT ASSIST:
        // When a person extends their leg (clearly collinear in 3D: dotCollinear > 0.50 OR in 2D: dot2D > 0.75):
        // Lock knee flexion directly to 0° (fully straight leg)!
        let kneeFlex = Math.acos(Math.max(-1.0, Math.min(1.0, dotCollinear))); // [0, PI]
        const isExtended = (dotCollinear > 0.50 || dot2D > 0.75);
        if (isExtended) {
          const t3D = Math.max(0.0, Math.min(1.0, (dotCollinear - 0.50) / 0.35));
          const t2D = Math.max(0.0, Math.min(1.0, (dot2D - 0.75) / 0.18));
          const tExt = Math.max(t3D, t2D);
          const easeExt = tExt * tExt * (3.0 - 2.0 * tExt);
          kneeFlex *= (1.0 - easeExt);
        }
        kneeFlex = Math.max(0.0, Math.min(Math.PI * 0.86, kneeFlex)); // clamp to 155 deg

        const qLowerLocal = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), kneeFlex);
        bLower.quaternion.slerp(qLowerLocal, alpha);
      }
    }

    // --- FALLBACK KINEMATIC BONE ALIGNMENT ---
    function alignBone(bone, targetDir, alpha = 0.85) {
      if (!bone || !bone.restWorldDir || !targetDir || targetDir.lengthSq() < 1e-5) return;
      const vFrom = bone.restWorldDir;
      let vTo = targetDir.clone().normalize();
      const dot = vFrom.dot(vTo);
      if (dot < -0.92) {
        vTo.z = Math.max(vTo.z, 0.35);
        vTo.normalize();
      }
      const rotWorld = new THREE.Quaternion().setFromUnitVectors(vFrom, vTo);
      const targetWorldQ = rotWorld.clone().multiply(bone.restWorldQ);
      const parentWorldQ = new THREE.Quaternion();
      if (bone.parent) bone.parent.getWorldQuaternion(parentWorldQ);
      const targetLocalQ = parentWorldQ.clone().invert().multiply(targetWorldQ);
      bone.quaternion.slerp(targetLocalQ, alpha);
      bone.updateMatrixWorld(true);
    }

    // --- DYNAMIC CLAVICLE / SCAPULAR PROTRACTION & RETRACTION (HIKITE) ---
    function alignShoulder(bone, vArm, sideKey = "R") {
      if (!bone || !vArm || vArm.lengthSq() < 1e-4) return;
      const uArm = vArm.clone().normalize();
      const fwdReach = Math.max(0, uArm.z);
      const backReach = Math.min(0, uArm.z); // Scapular Retraction when drawing fist into HIKITE!
      const elevate = Math.max(0, uArm.y);
      const depress = Math.min(0, uArm.y);
      let vClavicle = null;

      if (sideKey === "R") {
        const crossReach = Math.max(0, uArm.x);
        const yOffset = elevate > 0 ? elevate * 0.18 : depress * 0.15;
        vClavicle = new THREE.Vector3(-1.0 + crossReach * 0.25, yOffset, fwdReach * 0.25 + backReach * 0.22).normalize();
      } else {
        const crossReach = Math.max(0, -uArm.x);
        const yOffset = elevate > 0 ? elevate * 0.18 : depress * 0.15;
        vClavicle = new THREE.Vector3(1.0 - crossReach * 0.25, yOffset, fwdReach * 0.25 + backReach * 0.22).normalize();
      }
      alignBone(bone, vClavicle, 0.45);
    }

    // --- 3D PALM & WRIST ORIENTATION ---
    const handOrientMemory = {
      R: { fwd: null, norm: null },
      L: { fwd: null, norm: null }
    };

    function alignHand(bone, targetFwd, targetNorm, sideKey = "R") {
      if (!bone) return;
      if (!targetFwd || !targetNorm) {
        if (bone.restLocalQ) bone.quaternion.slerp(bone.restLocalQ, 0.12);
        return;
      }
      const mem = handOrientMemory[sideKey] || handOrientMemory.R;

      let curFwd = targetFwd.clone().normalize();
      let curNorm = targetNorm.clone().normalize();
      if (curFwd.lengthSq() < 1e-4 || curNorm.lengthSq() < 1e-4) return;

      if (!mem.fwd) {
        mem.fwd = curFwd.clone();
        mem.norm = curNorm.clone();
      } else {
        const angFwd = mem.fwd.angleTo(curFwd);
        const angNorm = mem.norm.angleTo(curNorm);
        const maxAng = Math.max(angFwd, angNorm);
        if (maxAng < 0.14) return;
        const alpha = maxAng > 0.30 ? 0.45 : 0.20;
        mem.fwd.lerp(curFwd, alpha).normalize();
        mem.norm.lerp(curNorm, alpha).normalize();
      }

      const uy = mem.fwd.clone().normalize();
      const dorsal = mem.norm.clone().negate().normalize();
      let uz = dorsal.clone().sub(uy.clone().multiplyScalar(dorsal.dot(uy)));
      if (uz.lengthSq() < 1e-4) uz.set(0, 1, 0);
      else uz.normalize();

      const ux = new THREE.Vector3().crossVectors(uy, uz).normalize();
      uz.crossVectors(ux, uy).normalize();

      const basisMat = new THREE.Matrix4().makeBasis(ux, uy, uz);
      const targetWorldQ = new THREE.Quaternion().setFromRotationMatrix(basisMat);

      const parentWorldQ = new THREE.Quaternion();
      if (bone.parent) bone.parent.getWorldQuaternion(parentWorldQ);
      const targetLocalQ = parentWorldQ.clone().invert().multiply(targetWorldQ);

      bone.quaternion.slerp(targetLocalQ, 0.40);
      bone.updateMatrixWorld(true);
    }

    // --- 3D FOOT ORIENTATION (YAW HEADING & TATAMI GROUNDING) ---
    const footOrientMemory = {
      R: { yaw: null, pitch: null },
      L: { yaw: null, pitch: null }
    };

    function alignFoot(bFoot, vFoot, bLowerLeg, pelvisLateral, sideKey = "R", alpha = 0.85) {
      if (!bFoot || !vFoot || vFoot.lengthSq() < 1e-4) {
        if (bFoot && bFoot.restLocalQ) bFoot.quaternion.slerp(bFoot.restLocalQ, 0.15);
        return;
      }
      const mem = footOrientMemory[sideKey] || footOrientMemory.R;

      let curYaw = Math.atan2(vFoot.x, vFoot.z);
      const lenXZ = Math.hypot(vFoot.x, vFoot.z);
      let curPitch = Math.atan2(vFoot.y, Math.max(0.04, lenXZ));
      curPitch = Math.max(-0.85, Math.min(0.25, curPitch));

      if (mem.yaw === null) {
        mem.yaw = curYaw;
        mem.pitch = curPitch;
      } else {
        let diffYaw = curYaw - mem.yaw;
        while (diffYaw > Math.PI) diffYaw -= 2 * Math.PI;
        while (diffYaw < -Math.PI) diffYaw += 2 * Math.PI;

        const maxDiff = Math.max(Math.abs(diffYaw), Math.abs(curPitch - mem.pitch));
        const filterAlpha = maxDiff > 0.20 ? 0.75 : (maxDiff > 0.05 ? 0.40 : 0.20);
        mem.yaw += diffYaw * filterAlpha;
        mem.pitch = mem.pitch * (1 - filterAlpha) + curPitch * filterAlpha;
      }

      const cosP = Math.cos(mem.pitch);
      const sinP = Math.sin(mem.pitch);
      const sinY = Math.sin(mem.yaw);
      const cosY = Math.cos(mem.yaw);

      const yFoot = new THREE.Vector3(sinY * cosP, sinP, cosY * cosP).normalize();

      let xLat = pelvisLateral ? pelvisLateral.clone() : new THREE.Vector3(1, 0, 0);
      let xFoot = xLat.clone().sub(yFoot.clone().multiplyScalar(xLat.dot(yFoot)));
      if (xFoot.lengthSq() < 1e-4) xFoot.set(1, 0, 0);
      else xFoot.normalize();

      const zFoot = new THREE.Vector3().crossVectors(xFoot, yFoot).normalize();
      xFoot.crossVectors(yFoot, zFoot).normalize();

      const mFoot = new THREE.Matrix4().makeBasis(xFoot, yFoot, zFoot);
      const targetWorldQ = new THREE.Quaternion().setFromRotationMatrix(mFoot);

      const parentWorldQ = new THREE.Quaternion();
      if (bFoot.parent) bFoot.parent.getWorldQuaternion(parentWorldQ);
      const targetLocalQ = parentWorldQ.clone().invert().multiply(targetWorldQ);

      bFoot.quaternion.slerp(targetLocalQ, alpha);
      bFoot.updateMatrixWorld(true);
    }

    // Metsuke gaze trim offset (chin slightly up in traditional Shotokan posture)
    let headPitchOffset = 0.05;
    window.calibrateHead = function() {
      headPitchOffset = 0.05;
      const btn = document.getElementById('btn-head');
      if (btn) {
        const t = document.getElementById("hud-head-text"); if (t) t.textContent = "Взгляд: Откалиброван"; else btn.textContent = "Взгляд: Откалиброван";
        setTimeout(() => { const t = document.getElementById("hud-head-text"); if (t) t.textContent = "Взгляд (Metsuke)"; else btn.textContent = "Взгляд (Metsuke)"; }, 1500);
      }
    };
    window.adjustHeadPitch = function(delta) {
      headPitchOffset += delta;
    };

    // Seated stance and continuous foot grounding solver
    let seatedWeight = 0.0;
    let smoothRootY = 0.0;
    let smoothRootZ = 0.0;

    // PhysCap Option A: Foot Ground-Locking & Anti-Skate State
    const footLockState = {
      R: { isPlanted: true, plantPos: new THREE.Vector3(), prevPos: new THREE.Vector3() },
      L: { isPlanted: true, plantPos: new THREE.Vector3(), prevPos: new THREE.Vector3() }
    };
    let nominalLegLen = 0.82;

    // View Modes: "avatar" (default), "both", "skeleton"
    let currentViewMode = "avatar";
    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('telem-mode').textContent =
        mode === "avatar" ? "Аватар Karateka" : (mode === "skeleton" ? "Только скелет" : "Аватар + Скелет");

      if (avatarModel) avatarModel.visible = (mode === "avatar" || mode === "both");
      if (skeletonHelper) skeletonHelper.visible = (mode === "skeleton" || mode === "both");
      skeletonGroup.visible = (mode === "skeleton" || mode === "both");
    }

    // Avatar Mirror Mode: false = Anatomical (user right -> avatar right), true = Mirror (reflective)
    let mirrorAvatar = false;
    window.toggleMirrorAvatar = function() {
      window.setMirrorAvatar(!mirrorAvatar);
    };
    window.setMirrorAvatar = function(enabled) {
      mirrorAvatar = !!enabled;
      const btn = document.getElementById('btn-mirror');
      if (btn) {
        const mt = document.getElementById("hud-mirror-text"); if (mt) mt.textContent = mirrorAvatar ? "Зеркало" : "Прямой"; else btn.textContent = mirrorAvatar ? "Зеркало" : "Прямой";
        btn.classList.toggle('active', mirrorAvatar);
      }
    };

    // --- UPDATE POSE API (CALLED BY QT ENGINE) ---
    window.updatePose = function(frameData) {
      if (!frameData) return;

      const pts = frameData.joints || {};

      const hasLandmarks = (pts && Object.keys(pts).length >= 4);

      // If precomputed retargeted local bones are provided from Retargeter AND no 3D landmarks are available, apply them as fallback
      if (!hasLandmarks && frameData.bones && Object.keys(frameData.bones).length > 0) {
        for (const [bName, qArr] of Object.entries(frameData.bones)) {
          const b = getBone(bName);
          if (b && Array.isArray(qArr) && qArr.length === 4) {
            const tQ = new THREE.Quaternion(qArr[0], qArr[1], qArr[2], qArr[3]);
            b.quaternion.slerp(tQ, 0.85);
            b.updateMatrixWorld(true);
          }
        }
      }
      const vis = frameData.confidence || {};

      // 1. Position skeleton group only when active
      if (skeletonGroup.visible) {
        if (frameData.rootPosition) {
          skeletonGroup.position.set(
            frameData.rootPosition[0],
            frameData.rootPosition[1],
            frameData.rootPosition[2]
          );
        } else {
          skeletonGroup.position.set(0, 0.9, 0);
        }

        // Update Neutral 3D Skeleton
        for (const [name, sphere] of Object.entries(jointSpheres)) {
          if (pts[name]) {
            sphere.position.set(pts[name][0], pts[name][1], pts[name][2]);
            sphere.visible = true;
          } else {
            sphere.visible = false;
          }
        }

        for (const { mesh, a, b } of boneCylinders) {
          if (pts[a] && pts[b]) {
            const pA = new THREE.Vector3(...pts[a]);
            const pB = new THREE.Vector3(...pts[b]);
            const dist = pA.distanceTo(pB);

            mesh.position.copy(pA).add(pB).multiplyScalar(0.5);
            mesh.scale.set(1, dist, 1);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pB.clone().sub(pA).normalize());
            mesh.visible = true;
          } else {
            mesh.visible = false;
          }
        }
      }

      // 2. Update Rigged Avatar
      if (isModelReady && avatarModel) {
        // Direct Kinematic Bone Alignment from 3D Landmark Positions
        if (Object.keys(pts).length >= 4) {
          const minConf = 0.08;
          const conf = (name) => (vis[name] !== undefined ? vis[name] : 1.0);

          // --- FULL 3D PELVIS / HIPS & MULTI-SEGMENT SPINE SOLVER ---
          // Reconstructs authentic 3D pelvis yaw rotation (Zenkutsu, Kokutsu, Kiba dachi)
          // and anterior pelvic tilt (hinging forward at the hips to touch knees and legs).
          // Distributes curvature naturally across Pelvis (Hips: ~35%), Lumbar (Spine: ~45%),
          // Mid (Spine1: ~75%), and Thoracic (Chest: 100%), enabling the avatar to bend over forward,
          // reach down, and place hands on knees/legs without distortion.
          let torsoFwdZ = 0.0;
          let torsoFwdNormal = new THREE.Vector3(0, 0, 1);
          let pelvisLateral = new THREE.Vector3(1, 0, 0);
          let shoulderLateral = new THREE.Vector3(1, 0, 0);
          let midHip = null;
          let midSh = null;
          let vSpine = new THREE.Vector3(0, 1, 0);
          if (pts["left_hip"] && pts["right_hip"] && pts["left_shoulder"] && pts["right_shoulder"]) {
            const pLSh = pts["left_shoulder"];
            const pRSh = pts["right_shoulder"];
            const pLHp = pts["left_hip"];
            const pRHp = pts["right_hip"];

            midHip = new THREE.Vector3(...pLHp).add(new THREE.Vector3(...pRHp)).multiplyScalar(0.5);
            midSh = new THREE.Vector3(...pLSh).add(new THREE.Vector3(...pRSh)).multiplyScalar(0.5);
            if (mirrorAvatar) {
              midHip.x = -midHip.x;
              midSh.x = -midSh.x;
            }

            vSpine.copy(midSh).sub(midHip);
            torsoFwdZ = vSpine.z;

            // 1. Pelvis / Hips Orientation Solver (Continuous 360° Azimuth)
            const bHips = getBone("Hips");
            if (bHips && bHips.restWorldQ) {
              let vHipsLat = new THREE.Vector3(...pLHp).sub(new THREE.Vector3(...pRHp));
              if (mirrorAvatar) vHipsLat.x = -vHipsLat.x;

              if (vHipsLat.lengthSq() > 1e-4) {
                pelvisLateral.copy(vHipsLat).normalize();
                
                const pRHpCur = new THREE.Vector3(...pRHp);
                const pLHpCur = new THREE.Vector3(...pLHp);
                if (mirrorAvatar) {
                  pRHpCur.x = -pRHpCur.x;
                  pLHpCur.x = -pLHpCur.x;
                }
                const vHipsLatRtoL = new THREE.Vector3().subVectors(pLHpCur, pRHpCur);
                const nPelvisFwd = new THREE.Vector3(-vHipsLatRtoL.z, 0, vHipsLatRtoL.x).normalize();
                let rawHipYaw = Math.atan2(nPelvisFwd.x, nPelvisFwd.z);
                if (lastPelvisRawYaw !== null) {
                  let dYaw = rawHipYaw - lastPelvisRawYaw;
                  while (dYaw > Math.PI) dYaw -= 2 * Math.PI;
                  while (dYaw < -Math.PI) dYaw += 2 * Math.PI;
                  continuousPelvisYaw += dYaw;
                } else {
                  continuousPelvisYaw = rawHipYaw;
                }
                lastPelvisRawYaw = rawHipYaw;

                // Pelvic forward tilt when leaning or bending forward
                const trunkForwardPitch = Math.atan2(vSpine.z, Math.max(0.08, vSpine.y));
                let pelvicTilt = trunkForwardPitch * 0.35;
                pelvicTilt = Math.max(-0.50, Math.min(0.50, pelvicTilt));

                // Pelvic Roll around Z (lateral weight shift)
                let pelvicRoll = Math.atan2(vHipsLat.y, Math.hypot(vHipsLat.x, vHipsLat.z));
                pelvicRoll = Math.max(-0.40, Math.min(0.40, pelvicRoll));

                const eulerHips = new THREE.Euler(-pelvicTilt, continuousPelvisYaw, pelvicRoll, 'YXZ');
                const qPelvisDelta = new THREE.Quaternion().setFromEuler(eulerHips);
                const targetHipsWorldQ = qPelvisDelta.clone().multiply(bHips.restWorldQ);

                const parentWorldQHips = new THREE.Quaternion();
                if (bHips.parent) bHips.parent.getWorldQuaternion(parentWorldQHips);
                const targetLocalHips = parentWorldQHips.clone().invert().multiply(targetHipsWorldQ);

                bHips.quaternion.slerp(targetLocalHips, 0.75);
                bHips.updateMatrixWorld(true);
              }
            }

            // 2. Full Torso Rotation Solver (Authentic Hanmi / Shomen / Stance Dynamics)
            // Preserves 100% natural rotation of shoulders and ribcage without artificial deadbands!
            if (vSpine.lengthSq() > 1e-4) {
              const uy = vSpine.clone().normalize();
              let vLat = new THREE.Vector3(...pLSh).sub(new THREE.Vector3(...pRSh));
              if (mirrorAvatar) vLat.x = -vLat.x;

              if (vLat.lengthSq() > 1e-4) {
                shoulderLateral.copy(vLat).normalize();
                vLat.normalize();
                // Gram-Schmidt orthogonalization: project lateral vector onto plane normal to spine
                const dotLat = vLat.dot(uy);
                const ux = vLat.clone().sub(uy.clone().multiplyScalar(dotLat)).normalize();
                if (ux.lengthSq() > 1e-4) {
                  const uz = new THREE.Vector3().crossVectors(ux, uy).normalize();
                  torsoFwdNormal.copy(uz);
                  ux.crossVectors(uy, uz).normalize();

                  const basisMat = new THREE.Matrix4().makeBasis(ux, uy, uz);
                  const targetTorsoWorldQ = new THREE.Quaternion().setFromRotationMatrix(basisMat);

                  const bSpine = getBone("Spine");
                  const bSpine1 = getBone("Spine1");
                  const bChest = getBone("Chest");
                  const hipsWorldQ = new THREE.Quaternion();
                  if (bHips) bHips.getWorldQuaternion(hipsWorldQ);

                  // 1. Lumbar Spine (Spine) takes ~35% of bend from hips to chest
                  if (bSpine) {
                    const qLumbarWorld = hipsWorldQ.clone().slerp(targetTorsoWorldQ, 0.35);
                    const parentQSpine = new THREE.Quaternion();
                    if (bSpine.parent) bSpine.parent.getWorldQuaternion(parentQSpine);
                    const targetLocalSpine = parentQSpine.clone().invert().multiply(qLumbarWorld);
                    bSpine.quaternion.slerp(targetLocalSpine, 0.75);
                    bSpine.updateMatrixWorld(true);
                  }

                  // 2. Mid Thoracic Spine (Spine1) takes ~70% of bend from hips to chest
                  if (bSpine1) {
                    const qMidWorld = hipsWorldQ.clone().slerp(targetTorsoWorldQ, 0.70);
                    const parentQSpine1 = new THREE.Quaternion();
                    if (bSpine1.parent) bSpine1.parent.getWorldQuaternion(parentQSpine1);
                    const targetLocalSpine1 = parentQSpine1.clone().invert().multiply(qMidWorld);
                    bSpine1.quaternion.slerp(targetLocalSpine1, 0.75);
                    bSpine1.updateMatrixWorld(true);
                  }

                  // 3. Upper Chest (Chest) carries full 100% orientation
                  if (bChest) {
                    const parentQChest = new THREE.Quaternion();
                    if (bChest.parent) bChest.parent.getWorldQuaternion(parentQChest);
                    const targetLocalChest = parentQChest.clone().invert().multiply(targetTorsoWorldQ);
                    bChest.quaternion.slerp(targetLocalChest, 0.75);
                    bChest.updateMatrixWorld(true);
                  }
                }
              }
            }
          }

          // Bone mapping: Anatomical vs Mirror
          const shoulderNameR = mirrorAvatar ? "Shoulder.L" : "Shoulder.R";
          const armNameR = mirrorAvatar ? "UpperArm.L" : "UpperArm.R";
          const forearmNameR = mirrorAvatar ? "LowerArm.L" : "LowerArm.R";
          const handNameR = mirrorAvatar ? "Hand.L" : "Hand.R";

          const shoulderNameL = mirrorAvatar ? "Shoulder.R" : "Shoulder.L";
          const armNameL = mirrorAvatar ? "UpperArm.R" : "UpperArm.L";
          const forearmNameL = mirrorAvatar ? "LowerArm.R" : "LowerArm.L";
          const handNameL = mirrorAvatar ? "Hand.R" : "Hand.L";

          const legNameR = mirrorAvatar ? "UpperLeg.L" : "UpperLeg.R";
          const shinNameR = mirrorAvatar ? "LowerLeg.L" : "LowerLeg.R";
          const footNameR = mirrorAvatar ? "Foot.L" : "Foot.R";
          const legNameL = mirrorAvatar ? "UpperLeg.R" : "UpperLeg.L";
          const shinNameL = mirrorAvatar ? "LowerLeg.R" : "LowerLeg.L";
          const footNameL = mirrorAvatar ? "Foot.R" : "Foot.L";

          // Physical Right Arm & Shoulder Rotation
          const bShoulderR = getBone(shoulderNameR);
          const bUpperR = getBone(armNameR);
          const bLowerR = getBone(forearmNameR);
          const bHandR = getBone(handNameR);
          const fDataR = frameData.fingers ? (mirrorAvatar ? frameData.fingers.left : frameData.fingers.right) : null;
          if (pts["right_shoulder"] && pts["right_elbow"] && conf("right_shoulder") >= minConf && conf("right_elbow") >= minConf) {
            const vArm = new THREE.Vector3(...pts["right_elbow"]).sub(new THREE.Vector3(...pts["right_shoulder"]));
            if (mirrorAvatar) vArm.x = -vArm.x;

            if (bShoulderR) {
              alignShoulder(bShoulderR, vArm, mirrorAvatar ? "L" : "R");
            }

            let vForearm = null;
            if (pts["right_wrist"] && conf("right_wrist") >= minConf) {
              vForearm = new THREE.Vector3(...pts["right_wrist"]).sub(new THREE.Vector3(...pts["right_elbow"]));
              if (mirrorAvatar) vForearm.x = -vForearm.x;

              if (vArm.lengthSq() > 1e-4 && vForearm.lengthSq() > 1e-4) {
                const uArm = vArm.clone().normalize();
                const uForearm = vForearm.clone().normalize();
                const armCollinearDot = uArm.dot(uForearm);
                if (armCollinearDot > 0.92) {
                  const straightAlpha = Math.max(0.0, Math.min(1.0, (armCollinearDot - 0.95) / 0.04));
                  vForearm.lerp(uArm.clone().multiplyScalar(vForearm.length()), straightAlpha);
                }
              }
            }

            alignArm(bUpperR, bLowerR, vArm, vForearm, torsoFwdNormal, shoulderLateral, mirrorAvatar ? "L" : "R", 0.85);
          } else {
            if (bShoulderR && bShoulderR.restLocalQ) bShoulderR.quaternion.slerp(bShoulderR.restLocalQ, 0.08);
            if (bUpperR && bUpperR.restLocalQ) bUpperR.quaternion.slerp(bUpperR.restLocalQ, 0.08);
            if (bLowerR && bLowerR.restLocalQ) bLowerR.quaternion.slerp(bLowerR.restLocalQ, 0.08);
          }

          // Right Hand / Palm Orientation
          if (bHandR) {
            if (fDataR && fDataR.palm_normal && fDataR.hand_direction) {
              const targetFwd = new THREE.Vector3(...fDataR.hand_direction);
              const targetNorm = new THREE.Vector3(...fDataR.palm_normal);
              if (mirrorAvatar) {
                targetFwd.x = -targetFwd.x;
                targetNorm.x = -targetNorm.x;
              }
              alignHand(bHandR, targetFwd, targetNorm, "R");
            } else if (bHandR.restLocalQ) {
              bHandR.quaternion.slerp(bHandR.restLocalQ, 0.08);
            }
          }

          // Physical Left Arm & Shoulder Rotation
          const bShoulderL = getBone(shoulderNameL);
          const bUpperL = getBone(armNameL);
          const bLowerL = getBone(forearmNameL);
          const bHandL = getBone(handNameL);
          const fDataL = frameData.fingers ? (mirrorAvatar ? frameData.fingers.right : frameData.fingers.left) : null;
          if (pts["left_shoulder"] && pts["left_elbow"] && conf("left_shoulder") >= minConf && conf("left_elbow") >= minConf) {
            const vArm = new THREE.Vector3(...pts["left_elbow"]).sub(new THREE.Vector3(...pts["left_shoulder"]));
            if (mirrorAvatar) vArm.x = -vArm.x;

            if (bShoulderL) {
              alignShoulder(bShoulderL, vArm, mirrorAvatar ? "R" : "L");
            }

            let vForearm = null;
            if (pts["left_wrist"] && conf("left_wrist") >= minConf) {
              vForearm = new THREE.Vector3(...pts["left_wrist"]).sub(new THREE.Vector3(...pts["left_elbow"]));
              if (mirrorAvatar) vForearm.x = -vForearm.x;

              if (vArm.lengthSq() > 1e-4 && vForearm.lengthSq() > 1e-4) {
                const uArm = vArm.clone().normalize();
                const uForearm = vForearm.clone().normalize();
                const armCollinearDot = uArm.dot(uForearm);
                if (armCollinearDot > 0.92) {
                  const straightAlpha = Math.max(0.0, Math.min(1.0, (armCollinearDot - 0.95) / 0.04));
                  vForearm.lerp(uArm.clone().multiplyScalar(vForearm.length()), straightAlpha);
                }
              }
            }

            alignArm(bUpperL, bLowerL, vArm, vForearm, torsoFwdNormal, shoulderLateral, mirrorAvatar ? "R" : "L", 0.85);
          } else {
            if (bShoulderL && bShoulderL.restLocalQ) bShoulderL.quaternion.slerp(bShoulderL.restLocalQ, 0.08);
            if (bUpperL && bUpperL.restLocalQ) bUpperL.quaternion.slerp(bUpperL.restLocalQ, 0.08);
            if (bLowerL && bLowerL.restLocalQ) bLowerL.quaternion.slerp(bLowerL.restLocalQ, 0.08);
          }

          // Left Hand / Palm Orientation
          if (bHandL) {
            if (fDataL && fDataL.palm_normal && fDataL.hand_direction) {
              const targetFwd = new THREE.Vector3(...fDataL.hand_direction);
              const targetNorm = new THREE.Vector3(...fDataL.palm_normal);
              if (mirrorAvatar) {
                targetFwd.x = -targetFwd.x;
                targetNorm.x = -targetNorm.x;
              }
              alignHand(bHandL, targetFwd, targetNorm, "L");
            } else if (bHandL.restLocalQ) {
              bHandL.quaternion.slerp(bHandL.restLocalQ, 0.08);
            }
          }

          // Smart Supporting Foot Grounding & Stance Root Descent
          const hasKneeR = pts["right_hip"] && pts["right_knee"] && conf("right_hip") >= minConf && conf("right_knee") >= minConf;
          const hasAnkleR = pts["right_ankle"] && conf("right_ankle") >= minConf;
          const hasKneeL = pts["left_hip"] && pts["left_knee"] && conf("left_hip") >= minConf && conf("left_knee") >= minConf;
          const hasAnkleL = pts["left_ankle"] && conf("left_ankle") >= minConf;

          let dropL = 0.0;
          let dropR = 0.0;
          if (pts["left_hip"] && pts["right_hip"]) {
            const hipY = (pts["left_hip"][1] + pts["right_hip"][1]) * 0.5;
            if (hasKneeL && (hasAnkleL || pts["left_heel"])) {
              const footYL = (pts["left_heel"] && conf("left_heel") >= minConf) ? pts["left_heel"][1] : pts["left_ankle"][1];
              dropL = hipY - footYL;
            }
            if (hasKneeR && (hasAnkleR || pts["right_heel"])) {
              const footYR = (pts["right_heel"] && conf("right_heel") >= minConf) ? pts["right_heel"][1] : pts["right_ankle"][1];
              dropR = hipY - footYR;
            }
          }

          const maxSupportDrop = Math.max(dropL, dropR);
          if (maxSupportDrop > 0.65 && maxSupportDrop < 1.15) {
            if (maxSupportDrop > nominalLegLen) {
              nominalLegLen = nominalLegLen * 0.90 + maxSupportDrop * 0.10;
            }
          }

          const biomech = frameData.biomechanics || {};
          const detectedStance = biomech.stance || "Shizentai";
          const isZenkutsu = detectedStance === "Zenkutsu-dachi";
          const isKiba = detectedStance === "Kiba-dachi";
          const isKokutsu = detectedStance === "Kokutsu-dachi";
          const isKick = dropL < 0.35 || dropR < 0.35 || (biomech.kick_technique && biomech.kick_technique !== "None");

          let stanceDrop = maxSupportDrop;
          if (dropL > 0.35 && dropR > 0.35) {
            if (isZenkutsu || isKokutsu) {
              const minDrop = Math.min(dropL, dropR);
              stanceDrop = minDrop * 0.70 + maxSupportDrop * 0.30;
            } else if (isKiba) {
              stanceDrop = Math.min(dropL, dropR);
            } else {
              stanceDrop = (dropL + dropR) * 0.5;
            }
          } else if (isKick) {
            stanceDrop = dropL < 0.35 ? dropR : dropL;
          }

          let targetRootY = 0.0;
          if (stanceDrop > 0.25) {
            const legCompression = stanceDrop - nominalLegLen;
            if (legCompression < -0.02) {
              targetRootY = Math.max(-0.65, legCompression + 0.02);
            }
          }

          const fwdBendShift = Math.max(0, torsoFwdZ) * 0.22;
          const targetRootZ = targetRootY * 0.25 - fwdBendShift;

          smoothRootY = smoothRootY * 0.50 + targetRootY * 0.50;
          smoothRootZ = smoothRootZ * 0.50 + targetRootZ * 0.50;

          if (avatarModel) {
            avatarModel.position.z = smoothRootZ;
          }

          const bUpperLegR = getBone(legNameR);
          const bLowerLegR = getBone(shinNameR);
          const bFootR = getBone(footNameR);

          const bUpperLegL = getBone(legNameL);
          const bLowerLegL = getBone(shinNameL);
          const bFootL = getBone(footNameL);

          // 4. Stable Anatomical Leg & Knee Alignment (No gimbal twists, no joint flips)
          if (hasKneeR && bUpperLegR) {
            const vThighR = new THREE.Vector3(...pts["right_knee"]).sub(new THREE.Vector3(...pts["right_hip"]));
            if (mirrorAvatar) vThighR.x = -vThighR.x;

            const anklePtR = (pts["right_ankle"] && conf("right_ankle") >= minConf) ? pts["right_ankle"] : pts["right_heel"];
            let vShinR = null;
            if (anklePtR && bLowerLegR) {
              vShinR = new THREE.Vector3(...anklePtR).sub(new THREE.Vector3(...pts["right_knee"]));
              if (mirrorAvatar) vShinR.x = -vShinR.x;
            }

            alignLeg(bUpperLegR, bLowerLegR, vThighR, vShinR, torsoFwdNormal, pelvisLateral, mirrorAvatar ? "L" : "R", 0.85);

            if (bFootR) {
              const origR = (pts["right_heel"] && conf("right_heel") >= minConf) ? pts["right_heel"] : pts["right_ankle"];
              const hasToeR = pts["right_foot_index"] && conf("right_foot_index") >= minConf;
              if (origR && hasToeR) {
                const vFoot = new THREE.Vector3(...pts["right_foot_index"]).sub(new THREE.Vector3(...origR));
                if (mirrorAvatar) vFoot.x = -vFoot.x;
                alignFoot(bFootR, vFoot, bLowerLegR, pelvisLateral, mirrorAvatar ? "L" : "R", 0.85);
              } else if (bFootR.restLocalQ) {
                bFootR.quaternion.slerp(bFootR.restLocalQ, 0.15);
              }
            }
          }

          if (hasKneeL && bUpperLegL) {
            const vThighL = new THREE.Vector3(...pts["left_knee"]).sub(new THREE.Vector3(...pts["left_hip"]));
            if (mirrorAvatar) vThighL.x = -vThighL.x;
      
            const anklePtL = (pts["left_ankle"] && conf("left_ankle") >= minConf) ? pts["left_ankle"] : pts["left_heel"];
            let vShinL = null;
            if (anklePtL && bLowerLegL) {
              vShinL = new THREE.Vector3(...anklePtL).sub(new THREE.Vector3(...pts["left_knee"]));
              if (mirrorAvatar) vShinL.x = -vShinL.x;
            }

            alignLeg(bUpperLegL, bLowerLegL, vThighL, vShinL, torsoFwdNormal, pelvisLateral, mirrorAvatar ? "R" : "L", 0.85);

            if (bFootL) {
              const origL = (pts["left_heel"] && conf("left_heel") >= minConf) ? pts["left_heel"] : pts["left_ankle"];
              const hasToeL = pts["left_foot_index"] && conf("left_foot_index") >= minConf;
              if (origL && hasToeL) {
                const vFoot = new THREE.Vector3(...pts["left_foot_index"]).sub(new THREE.Vector3(...origL));
                if (mirrorAvatar) vFoot.x = -vFoot.x;
                alignFoot(bFootL, vFoot, bLowerLegL, pelvisLateral, mirrorAvatar ? "R" : "L", 0.85);
              } else if (bFootL.restLocalQ) {
                bFootL.quaternion.slerp(bFootL.restLocalQ, 0.15);
              }
            }
          }

          // 5. Active Tatami Floor Grounding & Stance Maintenance Solver
          // Ensures the model actively strives to STAND on the floor at all times:
          // Whether standing on two feet or balancing on one foot with bent/tilted torso,
          // the supporting foot (lowest foot) is firmly pinned to the tatami floor (ankle at TARGET_ANKLE_Y = 0.080).
          if (avatarModel) {
            avatarModel.updateMatrixWorld(true);
            const TARGET_ANKLE_Y = 0.080;
            const bFootL = getBone(footNameL);
            const bFootR = getBone(footNameR);
            let lowestAnkleY = Infinity;
            const tmpP = new THREE.Vector3();

            if (bFootL) {
              bFootL.getWorldPosition(tmpP);
              if (tmpP.y < lowestAnkleY) lowestAnkleY = tmpP.y;
            }
            if (bFootR) {
              bFootR.getWorldPosition(tmpP);
              if (tmpP.y < lowestAnkleY) lowestAnkleY = tmpP.y;
            }

            // Detect airborne jump: both feet clearly elevated off ground
            let isAirborneJump = false;
            if (pts["left_ankle"] && pts["right_ankle"]) {
              const ankleYL = pts["left_ankle"][1];
              const ankleYR = pts["right_ankle"][1];
              // In mocap_tracker world coords, standing ankle is at Y ≈ -0.80.
              // Both ankles must be above -0.40 (jump of >40cm off ground)
              if (ankleYL > -0.40 && ankleYR > -0.40 && dropL < 0.40 && dropR < 0.40) {
                isAirborneJump = true;
              }
            }

            if (!isAirborneJump && lowestAnkleY < 2.5 && lowestAnkleY > -2.5) {
              const groundingDelta = TARGET_ANKLE_Y - lowestAnkleY;
              // Smooth, instant anchor to tatami: supporting foot stays solidly planted on the floor!
              avatarModel.position.y += groundingDelta;
              avatarModel.updateMatrixWorld(true);
            } else if (isAirborneJump) {
              avatarModel.position.y = smoothRootY;
              avatarModel.updateMatrixWorld(true);
            }
          }
        }

        // Neck stabilization: maintain upright cervical alignment
        const neckBone = getBone("Neck");
        if (neckBone && neckBone.restLocalQ) {
          neckBone.quaternion.slerp(neckBone.restLocalQ, 0.50);
        }

        // Head Metsuke posture adjustment
        const headBone = getBone("Head");
        if (headBone && headBone.restLocalQ) {
          const h = frameData.head || { pitch: 0, yaw: 0, roll: 0 };
          const pitchAngle = -(h.pitch || 0) + headPitchOffset;
          const yawAngle = (h.yaw || 0);
          const rollAngle = (h.roll || 0);
          const euler = new THREE.Euler(pitchAngle, yawAngle, rollAngle, 'YXZ');
          const targetLocal = headBone.restLocalQ.clone().multiply(new THREE.Quaternion().setFromEuler(euler));
          headBone.quaternion.slerp(targetLocal, 0.70);
        }

        // Finger curls & Real-Time Telemetry// Finger curls & Real-Time Telemetry
        if (frameData.fingers) {
          const fSideR = mirrorAvatar ? "L" : "R";
          const fSideL = mirrorAvatar ? "R" : "L";
          applyFingers(fSideR, frameData.fingers.right);
          applyFingers(fSideL, frameData.fingers.left);

          const tf = document.getElementById('telem-fingers');
          if (tf) {
            const fL = frameData.fingers.left;
            const fR = frameData.fingers.right;
            const detL = fL && fL.detected;
            const detR = fR && fR.detected;
            const cL = fL ? (fL.index !== undefined ? fL.index : (fL.general_curl || 0.15)) : 0.15;
            const cR = fR ? (fR.index !== undefined ? fR.index : (fR.general_curl || 0.15)) : 0.15;
            const iconL = detL ? (cL > 0.45 ? '✊' : '✋') : '⚪';
            const iconR = detR ? (cR > 0.45 ? '✊' : '✋') : '⚪';
            tf.innerHTML = `<span style="color:${detL ? '#10b981' : '#9ca3af'}">Л: ${iconL} ${Math.round(cL*100)}%</span> | <span style="color:${detR ? '#10b981' : '#9ca3af'}">П: ${iconR} ${Math.round(cR*100)}%</span>`;
          }
        }

        avatarModel.updateMatrixWorld(true);
      }
    };

    // Smooth finger state memory (EMA) with individual phalanx angles and abduction
    const fingerState = {
      L: {
        thumb: 0.15, index: 0.15, middle: 0.15, ring: 0.15, pinky: 0.15,
        phalanges: {},
        abduction: {}
      },
      R: {
        thumb: 0.15, index: 0.15, middle: 0.15, ring: 0.15, pinky: 0.15,
        phalanges: {},
        abduction: {}
      }
    };

    function applyFingers(side, fData) {
      const types = ["Thumb", "Index", "Middle", "Ring", "Pinky"];
      const sState = fingerState[side] || fingerState.L;
      if (!sState.phalanges) sState.phalanges = {};
      if (!sState.abduction) sState.abduction = {};

      const hasPhalanges = fData && fData.phalanges && fData.detected;

      for (const t of types) {
        const key = t.toLowerCase();
        let targetCurl = 0.15; // Natural relaxed Kamae hand

        if (fData && fData.detected && typeof fData[key] === 'number') {
          targetCurl = fData[key];
        } else if (fData && typeof fData.general_curl === 'number') {
          targetCurl = fData.general_curl;
        } else if (fData && typeof fData[key] === 'number') {
          targetCurl = fData[key];
        }

        // Smooth overall curl
        const prevCurl = sState[key] !== undefined ? sState[key] : 0.15;
        const diffCurl = Math.abs(targetCurl - prevCurl);
        const alphaCurl = diffCurl > 0.08 ? 0.75 : 0.40;
        sState[key] = prevCurl * (1.0 - alphaCurl) + targetCurl * alphaCurl;
        const curl = sState[key];

        // Non-linear martial arts fist closure curve:
        // Preserves delicate open-hand control in [0.0, 0.25] (Shuto-uke, Nukite),
        // and smoothly ramps into a rock-solid 100% tight clenched karate fist (Seiken) above 0.35!
        let closedCurl = curl;
        if (closedCurl > 0.25) {
          const u = Math.min(1.0, (closedCurl - 0.25) / 0.45);
          closedCurl = 0.25 + 0.75 * Math.sin(u * Math.PI * 0.5);
        }

        // Authentic reference karate fist target angles from Blender (chudan_zuki_left):
        // Index:  MCP ~82 deg (1.45 rad), PIP ~98 deg (1.75 rad), DIP ~65 deg (1.20 rad)
        // Middle: MCP ~80 deg (1.42 rad), PIP ~96 deg (1.72 rad), DIP ~66 deg (1.20 rad)
        // Ring:   MCP ~82 deg (1.43 rad), PIP ~92 deg (1.65 rad), DIP ~63 deg (1.15 rad)
        // Pinky:  MCP ~80 deg (1.42 rad), PIP ~92 deg (1.65 rad), DIP ~64 deg (1.15 rad)
        const maxAngles = (t === "Index")  ? [1.45, 1.75, 1.20] :
                          (t === "Middle") ? [1.42, 1.72, 1.20] :
                          (t === "Ring")   ? [1.43, 1.65, 1.15] : [1.42, 1.65, 1.15];

        let targetAngles;
        let targetAbd = 0.0;

        if (hasPhalanges && fData.phalanges[key]) {
          const raw = fData.phalanges[key];
          // Amplify MediaPipe phalanx angles towards full fist closure
          const amp = 1.0 + 0.45 * closedCurl;
          targetAngles = [
            Math.min(maxAngles[0], raw[0] * amp),
            Math.min(maxAngles[1], raw[1] * amp),
            Math.min(maxAngles[2], raw[2] * amp)
          ];
          if (fData.abduction && typeof fData.abduction[key] === 'number') {
            targetAbd = fData.abduction[key];
          }
        } else {
          targetAngles = [
            closedCurl * maxAngles[0],
            closedCurl * maxAngles[1],
            closedCurl * maxAngles[2]
          ];
        }

        if (!sState.phalanges[key]) sState.phalanges[key] = [0.15, 0.15, 0.15];
        const prevAngles = sState.phalanges[key];
        const smoothedAngles = [];
        for (let j = 0; j < 3; j++) {
          const pA = prevAngles[j] !== undefined ? prevAngles[j] : 0.15;
          const tA = targetAngles[j] !== undefined ? targetAngles[j] : 0.15;
          const diffA = Math.abs(tA - pA);
          const alphaA = diffA > 0.10 ? 0.75 : 0.35;
          smoothedAngles[j] = pA * (1.0 - alphaA) + tA * alphaA;
        }
        sState.phalanges[key] = smoothedAngles;

        const prevAbd = sState.abduction[key] !== undefined ? sState.abduction[key] : 0.0;
        const diffAbd = Math.abs(targetAbd - prevAbd);
        const alphaAbd = diffAbd > 0.10 ? 0.70 : 0.30;
        sState.abduction[key] = prevAbd * (1.0 - alphaAbd) + targetAbd * alphaAbd;
        const smoothAbd = sState.abduction[key];

        // Apply real anatomical bone rotations to all 3 phalanges
        for (let idx = 1; idx <= 3; idx++) {
          const b = getBone(`${t}${idx}.${side}`);
          if (b && b.restLocalQ) {
            if (t === "Thumb") {
              const sideSign = (side === "L") ? 1.0 : -1.0;
              if (idx === 1) {
                // CMC / Trapeziometacarpal: Authentic karate fist opposition axis from Blender armature
                // Left: [-0.76, +0.34, +0.56], Right: [-0.76, -0.30, -0.57]
                const thumbAxis = new THREE.Vector3(-0.7575, 0.3361 * sideSign, 0.5597 * sideSign).normalize();
                const thumbAngle1 = closedCurl * 1.38; // ~79 deg at full clench
                const qThumb1 = new THREE.Quaternion().setFromAxisAngle(thumbAxis, thumbAngle1);
                b.quaternion.copy(b.restLocalQ.clone().multiply(qThumb1));
              } else if (idx === 2) {
                // Thumb MCP/IP joint: curls down tightly over the clenched index finger
                const thumbAngle2 = closedCurl * 1.30; // ~75 deg
                const thumbAxis2 = new THREE.Vector3(-1.0, 0.20 * sideSign, 0.15 * sideSign).normalize();
                const qThumb2 = new THREE.Quaternion().setFromAxisAngle(thumbAxis2, thumbAngle2);
                b.quaternion.copy(b.restLocalQ.clone().multiply(qThumb2));
              } else {
                // Distal tip
                const thumbAngle3 = closedCurl * 0.90; // ~52 deg
                const qThumb3 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(-1.0, 0.0, 0.0), thumbAngle3);
                b.quaternion.copy(b.restLocalQ.clone().multiply(qThumb3));
              }
            } else {
              // Four fingers: MCP, PIP, DIP individual flexion around local -X
              const rawFlex = smoothedAngles[idx - 1] !== undefined ? smoothedAngles[idx - 1] : closedCurl * maxAngles[idx - 1];
              const flexAng = Math.max(0.0, Math.min(1.95, rawFlex));
              const flexQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(-1, 0, 0), flexAng);

              if (idx === 1) {
                // Phalanx 1 (MCP): Abduction (finger spreading apart in palm plane) around Z
                // For Left hand: Index spreads +Z, Pinky spreads -Z
                // For Right hand: Index spreads -Z, Pinky spreads +Z
                const sideSign = (side === "L") ? 1.0 : -1.0;
                let abdDir = 0.0;
                if (t === "Index") abdDir = 1.0 * sideSign;
                else if (t === "Pinky") abdDir = -1.2 * sideSign;
                else if (t === "Ring") abdDir = -0.4 * sideSign;

                const abdAng = smoothAbd * abdDir * 0.45;
                const abdQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), abdAng);
                b.quaternion.copy(b.restLocalQ.clone().multiply(abdQ).multiply(flexQ));
              } else {
                b.quaternion.copy(b.restLocalQ.clone().multiply(flexQ));
              }
            }
            b.updateMatrixWorld(true);
          }
        }
      }
    }

    window.resetPose = function() {
      seatedWeight = 0.0;
      smoothRootY = 0.0;
      smoothRootZ = 0.0;
      nominalLegLen = 0.82;
      for (const b of Object.values(boneMap)) {
        if (b.restLocalQ) b.quaternion.copy(b.restLocalQ);
      }
      if (avatarModel) {
        avatarModel.position.set(0, 0, 0);
        avatarModel.updateMatrixWorld(true);
      }
    };

    window.setCamera = function(preset) {
      if (preset === 'front') {
        camera.position.set(0, 1.25, 3.2);
        controls.target.set(0, 0.95, 0);
      } else if (preset === '34') {
        camera.position.set(2.0, 1.4, 2.5);
        controls.target.set(0, 0.95, 0);
      } else if (preset === 'side') {
        camera.position.set(3.2, 1.25, 0);
        controls.target.set(0, 0.95, 0);
      } else if (preset === 'back') {
        camera.position.set(0, 1.25, -3.2);
        controls.target.set(0, 0.95, 0);
      }
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop (no deprecated SkeletonHelper.update() call)
    let pendingPoseData = null;

    function animate() {
      requestAnimationFrame(animate);
      if (pendingPoseData && window.updatePose) {
        window.updatePose(pendingPoseData);
        pendingPoseData = null;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- LIVE WEBSOCKET CONNECTION FOR WEB MO-CAP ---
    function connectViewerWebSocket() {
      try {
        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${proto}//${window.location.host}/ws/viewer`;
        const ws = new WebSocket(wsUrl);
        ws.onopen = () => {
          console.log('[KarateViewer] Connected to live pose stream at', wsUrl);
          const telemMode = document.getElementById('telem-mode');
          if (telemMode) telemMode.innerText = 'Аватар (В ЭФИРЕ)';
        };
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data) {
              // Frame coalescing: store latest pose frame for render loop
              pendingPoseData = data;
            }
          } catch (e) {
            console.warn('[KarateViewer] Error parsing pose frame:', e);
          }
        };
        ws.onclose = () => {
          setTimeout(connectViewerWebSocket, 1500);
        };
        ws.onerror = () => {
          try { ws.close(); } catch(e) {}
        };
      } catch (err) {
        console.warn('[KarateViewer] WebSocket setup error:', err);
      }
    }

    if (window.location.host) {
      connectViewerWebSocket();
    }

    // Support window.postMessage from parent studio
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      const { type, preset, mode, mirror } = event.data;
      if (type === 'setCamera' && preset && window.setCamera) {
        window.setCamera(preset);
      } else if (type === 'resetPose' && window.resetPose) {
        window.resetPose();
      } else if (type === 'calibrateHead' && window.calibrateHead) {
        window.calibrateHead();
      } else if (type === 'setViewMode' && mode && window.setViewMode) {
        window.setViewMode(mode);
      } else if (type === 'setMirrorAvatar' && typeof mirror === 'boolean' && window.setMirrorAvatar) {
        window.setMirrorAvatar(mirror);
      }
    });
  </script>
</body>
