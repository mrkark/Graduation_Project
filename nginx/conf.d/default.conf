server {
    listen       80;
    listen  [::]:80;
    server_name  localhost _;

    # Внутренний DNS-резолвер Docker для динамического обнаружения контейнеров
    resolver 127.0.0.11 valid=15s ipv6=off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Защитные HTTP-заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Основной маршрутизатор SPA (Single Page Application)
    # Гарантирует моментальную загрузку 1-го экрана при прямом открытии любого URL
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. index.html никогда не кэшируется (чтобы обновления и новые версии загружались мгновенно)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 3. Агрессивное 1-годичное immutable кэширование для версионированных production-ассетов Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. Долгосрочное кэширование 3D моделей (.glb) и JSON анимаций (порт 80 разгружает сеть)
    location ~* \.(?:glb|gltf|bin|json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
    }

    # 5. Долгосрочное кэширование изображений и шрифтов
    location ~* \.(?:jpe?g|png|gif|webp|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 6. Раздача пользовательских файлов и постеров ката (/uploads/)
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @proxy_uploads;
    }

    location @proxy_uploads {
        set $backend_target http://server:5000;
        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 7. Reverse Proxy к Backend API (Node.js Express на порту 5000)
    location /api/ {
        set $backend_target http://server:5000;
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
        proxy_read_timeout 60s;
    }

    # 8. WebSocket Reverse Proxy для Socket.IO (чат и синхронизация)
    location /socket.io/ {
        set $backend_target http://server:5000;
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # 9. Reverse Proxy к Python AI MoCap Studio (порт 8000)
    location ~ ^/(studio|viewer|video_feed|qr|status|controls|cam1|cam2|cam3|ws) {
        set $mocap_target http://mocap-studio:8000;
        proxy_pass $mocap_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # 10. Страницы ошибок
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
