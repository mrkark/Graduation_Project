services:
  # 1. Контейнер базы данных (Microsoft SQL Server 2025)
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: bunkai-explorer-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Mrkark9000!'
      MSSQL_PID: 'developer'
    ports:
      - '1433:1433'
    volumes:
      - ${MSSQL_DATA_PATH:-D:/DockerServices/databases/mssql_data}:/var/opt/mssql/data
      - ${MSSQL_BACKUP_PATH:-D:/DB_Backups/MSSQL}:/var/opt/mssql/backup
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bunkai-network

  # 2. Контейнер бэкенда (Node.js Express + WebSocket API)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bunkai-explorer-server
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DB_HOST: mssql
      DB_PORT: 1433
      DB_NAME: BunkaiExplorer
      DB_USER: mrkark
      DB_PASSWORD: mrkark9000
      DB_ENCRYPT: 'true'
      DB_TRUST_SERVER_CERT: 'true'
      JWT_ACCESS_SECRET: change_this_access_secret_in_production
      JWT_REFRESH_SECRET: change_this_refresh_secret_in_production
      SEED_ADMIN_PASSWORD: 'Admin#12345'
      SEED_MODERATOR_PASSWORD: 'Moderator#12345'
      SEED_DEMO_PASSWORD: 'Demo#12345'
    ports:
      - '5000:5000'
    volumes:
      - ./uploads:/app/uploads
      - ./server/src:/app/src
    networks:
      - bunkai-network

  # 3. Контейнер фронтенда (React 18 + Three.js + Mocap Studio + Vite)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bunkai-explorer-client
    restart: unless-stopped
    depends_on:
      - server
      - mocap-studio
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
      STUDIO_URL: http://mocap-studio:8000
    ports:
      - '5173:5173'
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/vite.config.js:/app/vite.config.js
    networks:
      - bunkai-network

  # 4. Контейнер защищенного локального HTTPS шлюза для мобильных камер AI MoCap
  gateway:
    image: node:20-alpine
    container_name: bunkai-explorer-gateway
    restart: unless-stopped
    depends_on:
      - client
      - server
      - mocap-studio
    environment:
      TARGET_HOST: client
      VITE_PORT: 5173
      BACKEND_HOST: server
      BACKEND_PORT: 5000
      MOCAP_HTTPS_PORT: 8443
      HOST_IP: ${HOST_IP:-192.168.100.6}
    ports:
      - '8443:8443'
    volumes:
      - ./scripts:/app/scripts:ro
      - ./ssl:/app/ssl:ro
      - ./uploads:/app/uploads
    working_dir: /app
    command: ["node", "scripts/start-mocap-gateway.js"]
    networks:
      - bunkai-network

  # 5. Контейнер Python AI MoCap Studio (web_studio_server.py)
  mocap-studio:
    build:
      context: ./karate_motion_studio
      dockerfile: Dockerfile
    container_name: bunkai-explorer-mocap-studio
    restart: unless-stopped
    ports:
      - '8000:8000'
      - '8088:8088'
    environment:
      PYTHONUNBUFFERED: '1'
      HOST_IP: ${HOST_IP:-192.168.100.6}
    volumes:
      - ./karate_motion_studio:/app
      - ./ssl:/app/ssl:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bunkai-network

networks:
  bunkai-network:
    driver: bridge

